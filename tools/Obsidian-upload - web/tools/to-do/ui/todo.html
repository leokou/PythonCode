<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leo Todo</title>
<link rel="stylesheet" href="todo.css">
</head>
<body>
<div id="app">
  <!-- 顶部栏 -->
  <header id="topbar">
    <div class="brand">
      <span class="logo">✓</span>
      <span class="brand-name" id="app-name">Leo Todo</span>
      <span class="sync-dot" id="sync-dot" title="同步状态"></span>
    </div>

    <div class="top-actions">
      <div class="search-box">
        <input id="search-input" type="text" placeholder="搜索任务 / 标签 / 描述…">
        <button id="search-clear" class="icon-btn" title="清空搜索">✕</button>
      </div>
      <button id="sync-btn" class="btn btn-primary" title="同步 Microsoft To Do">
        <span class="spin" id="sync-spinner">⟳</span><span class="btn-label">同步</span>
      </button>
      <button id="login-btn" class="btn" title="Microsoft 登录状态">Microsoft</button>
      <button id="add-task-btn" class="btn btn-accent" title="新建任务">＋ 新建任务</button>
    </div>
  </header>

  <div id="main">
    <!-- 左侧栏：统计 + 过滤器 -->
    <aside id="sidebar">
      <div class="stats" id="stats"></div>
      <nav class="filters">
        <div class="filter-group">
          <div class="filter-title">状态</div>
          <button class="filter-item active" data-status="">全部</button>
          <button class="filter-item" data-status="todo">待办</button>
          <button class="filter-item" data-status="in_progress">进行中</button>
          <button class="filter-item" data-status="completed">已完成</button>
          <button class="filter-item deleted-filter" data-status="deleted">已删除</button>
        </div>
        <div class="filter-group">
          <div class="filter-title">项目</div>
          <div id="project-filters"></div>
        </div>
        <div class="filter-group">
          <div class="filter-title">标签</div>
          <div id="tag-filters"></div>
        </div>
      </nav>
    </aside>

    <!-- 任务列表 -->
    <section id="task-panel">
      <div class="list-header">
        <span id="list-title">全部任务</span>
        <span id="list-count" class="count"></span>
      </div>
      <div id="task-list" class="task-list"></div>
      <div id="task-empty" class="empty-tip">暂无任务，点击「＋ 新建任务」开始</div>
    </section>

    <!-- 详情面板 -->
    <section id="detail-panel" class="detail hidden">
      <div class="detail-head">
        <div class="detail-title-row">
          <button class="detail-check" id="detail-check" title="完成 / 恢复">○</button>
          <input id="detail-title" class="detail-title-input" placeholder="任务标题">
          <button class="detail-close icon-btn" id="detail-close" title="关闭">✕</button>
        </div>
        <div class="detail-meta">
          <span class="badge source-badge" id="detail-source">leo</span>
          <span class="badge sync-badge" id="detail-sync">local</span>
        </div>
      </div>

      <div class="detail-body">
        <div class="field-row">
          <label>项目</label>
          <input id="detail-project" type="text" placeholder="项目名（留空 = 默认列表）" list="project-list">
          <datalist id="project-list"></datalist>
        </div>
        <div class="field-row">
          <label>优先级</label>
          <select id="detail-priority">
            <option value="low">低</option>
            <option value="medium" selected>中</option>
            <option value="high">高</option>
          </select>
        </div>
        <div class="field-row">
          <label>截止时间</label>
          <input id="detail-due" type="datetime-local">
        </div>
        <div class="field-row">
          <label>标签</label>
          <input id="detail-tags" type="text" placeholder="逗号分隔：工作, 家庭">
        </div>
        <div class="field-row field-textarea">
          <label>描述</label>
          <textarea id="detail-description" placeholder="任务描述…" rows="6"></textarea>
        </div>

        <div class="attachments">
          <div class="attachments-title">附件 <button id="add-attachment-btn" class="icon-btn" title="添加附件">＋</button></div>
          <input type="file" id="attachment-file" multiple accept=".png,.jpg,.jpeg,.gif,.webp,image/*" hidden>
          <div id="attachment-list" class="attachment-list"></div>
        </div>
      </div>

      <div class="detail-actions">
        <button id="detail-save" class="btn btn-primary">保存</button>
        <button id="detail-delete" class="btn btn-danger">删除</button>
      </div>
    </section>
  </div>

  <!-- 新建任务弹窗 -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-head">
        <span>新建任务</span>
        <button class="icon-btn modal-close" id="modal-close">✕</button>
      </div>
      <div class="modal-body">
        <input id="new-title" class="input-lg" placeholder="任务标题" autofocus>
        <div class="new-row">
          <input id="new-project" list="project-list" placeholder="项目">
          <select id="new-priority">
            <option value="low">低优先级</option>
            <option value="medium" selected>中优先级</option>
            <option value="high">高优先级</option>
          </select>
        </div>
        <input id="new-tags" placeholder="标签（逗号分隔）">
        <textarea id="new-description" placeholder="任务描述…" rows="4"></textarea>
      </div>
      <div class="modal-foot">
        <button id="modal-cancel" class="btn">取消</button>
        <button id="modal-create" class="btn btn-accent">创建任务</button>
      </div>
    </div>
  </div>

  <!-- 设备码登录弹窗 -->
  <div id="device-overlay" class="modal-overlay hidden">
    <div class="modal device-modal">
      <div class="modal-head">
        <span>Microsoft 登录（设备码）</span>
        <button class="icon-btn modal-close" id="device-close">✕</button>
      </div>
      <div class="modal-body">
        <p>1. 打开以下网址并登录：</p>
        <p class="device-uri" id="device-uri"></p>
        <div class="device-row">
          <button id="device-open" class="btn">用谷歌浏览器打开</button>
        </div>
        <p>2. 输入验证码：</p>
        <p class="device-code" id="device-code"></p>
        <div class="device-row">
          <button id="device-copy" class="btn">复制验证码</button>
        </div>
        <p class="device-tip">登录后本窗口会自动继续…</p>
      </div>
      <div class="modal-foot">
        <button id="device-wait" class="btn btn-accent">我已登录，继续</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
</div>

<script src="todo.js"></script>
</body>
</html>

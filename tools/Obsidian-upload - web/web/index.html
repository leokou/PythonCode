<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>LeoDiary Capture</title>
  <link rel="stylesheet" href="style.css">
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/cm6.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <span>LeoDiary Capture</span>
    </div>
    <div class="hints">
      <span class="hint">Alt+S 呼出窗口</span>
      <span class="sep">·</span>
      <span class="hint">Ctrl+V 粘贴图片自动上传</span>
    </div>
  </header>

  <main class="workspace">
    <section class="pane editor-pane">
      <div class="pane-title">Markdown 编辑</div>
      <div id="editor"></div>
    </section>
    <section class="pane preview-pane">
      <div class="pane-title">实时预览</div>
      <div id="preview" class="preview-body"></div>
    </section>
  </main>

  <footer class="bottombar">
    <div class="status" id="status">就绪 · PicGo 图床</div>
    <div class="save-actions">
      <button class="btn-save" id="btn-inbox"><span class="btn-icon">&#128229;</span> 保存 Inbox</button>
      <button class="btn-save" id="btn-flash"><span class="btn-icon">&#129504;</span> 保存 FlashNote</button>
      <button class="btn-save" id="btn-log"><span class="btn-icon">&#128209;</span> 保存日志</button>
    </div>
  </footer>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>

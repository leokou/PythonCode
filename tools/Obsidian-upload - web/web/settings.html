<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>LeoDiary 设置</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <header class="set-topbar">
    <div class="set-brand">
      <span class="brand-dot"></span>
      <span>LeoDiary 设置</span>
    </div>
  </header>

  <main class="set-body">
    <div class="set-section">
      <label class="set-label" for="set-path">文件默认保存地址</label>
      <input type="text" id="set-path" class="set-input" spellcheck="false"
             placeholder="默认保存路径，例如 D:\Obsidian\LeoDiary">
      <div class="set-hint">每个页签的 Markdown 文件将保存到该目录下的 Inbox / FlashNote / Log 子文件夹。</div>
    </div>

    <div class="set-current" id="set-current">
      <span class="set-current-label">当前保存路径：</span>
      <span class="set-current-value" id="set-current-value">-</span>
    </div>

    <div class="set-actions">
      <button class="set-save" id="btn-set-save">保存设置</button>
    </div>
  </main>

  <div id="toast" class="toast hidden"></div>

  <script src="settings.js"></script>
</body>
</html>

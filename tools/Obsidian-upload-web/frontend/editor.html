<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title id="win-title">LeoDiary Capture</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="explorer.css">
  <link rel="stylesheet" href="toolbar/toolbar.css">
  <!-- 编辑器三层架构：Layout（布局） + Syntax（语法） + 主题配色（懒加载） -->
  <link rel="stylesheet" href="editor-layout.css">
  <link rel="stylesheet" href="editor-syntax.css">
  <!-- 主题 CSS 懒加载：仅按需加载当前主题，由 js/theme-loader.js + js/theme-manager.js 动态注入 -->
  <!-- 基础变量由 theme.css 提供（默认浅色），主题切换时动态加载对应 CSS -->
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/cm6.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand" id="brand" title="点击显示 / 收起工作区资源管理器">
      <span id="brand-name">LeoDiary Capture</span>
    </div>
    <nav class="tabs" id="tabs">
      <div class="tabs-list" id="tabs-list">
        <button class="tab-add" id="btn-add-tab" title="新增页签">＋ 新增</button>
      </div>
      <div class="tab-dropdown" id="tab-dropdown">
        <button class="tab-dropdown-btn" id="btn-tab-dropdown" title="页面列表">▼</button>
        <div class="dropdown-menu" id="tab-dropdown-menu"></div>
      </div>
    </nav>
    <button class="btn-tools" id="btn-outline" title="目录">📑</button>
    <button class="btn-tools" id="btn-history" title="历史">🕘</button>
    <button class="btn-tools" id="btn-tools" title="工具箱">🛠️</button>
    <button class="btn-tools" id="btn-settings" title="设置">⚙️</button>
  </header>

  <main class="workspace" id="workspace">
    <section class="pane workspace-pane" id="pane-workspace">
      <div class="workspace-toolbar exp-toolbar">
        <button id="btn-explorer-add" title="添加文件夹">📂</button>
        <button id="btn-explorer-collapse" title="全部收起（折叠所有文件夹）">⏫</button>
        <button id="btn-explorer-expand" title="全部展开（展开所有文件夹）">⏬</button>
        <button id="btn-explorer-sort" title="按最近修改排序（点击切换名称排序）">↕️</button>
        <button id="btn-workspace-refresh" title="刷新文件树">⟳</button>
        <button id="btn-favorites" title="收藏夹">⭐️</button>
      </div>
      <div class="workspace-search">
        <div class="workspace-search-wrap">
          <input id="workspace-search-input" type="text"
                 placeholder="搜索文件（Ctrl+H）…" autocomplete="off" spellcheck="false">
          <button id="btn-search-options" class="search-options-btn" title="搜索条件设置">⚙️</button>
        </div>
        <div class="search-options-panel" id="search-options-panel">
          <label class="search-option">
            <input type="checkbox" id="opt-match-case">
            <span>匹配大小写</span>
            <small>搜 Apple 只匹配 Apple，不匹配 apple</small>
          </label>
          <label class="search-option">
            <input type="checkbox" id="opt-regex">
            <span>正则表达式</span>
            <small>搜 \d{4}-\d{2}-\d{2} 可匹配日期</small>
          </label>
          <label class="search-option">
            <input type="checkbox" id="opt-whole-word">
            <span>整词匹配</span>
            <small>搜 cat 不匹配 category</small>
          </label>
          <label class="search-option">
            <input type="checkbox" id="opt-collapse">
            <span>折叠搜索结果</span>
            <small>同一文件多条命中只显示文件名</small>
          </label>
        </div>
      </div>
      <div id="workspace-tree" class="workspace-tree exp-tree"></div>
    </section>
    <div class="resizer" id="resizer-0" title="拖动调整宽度"></div>
    <section class="pane editor-pane" id="pane-editor">
      <div class="pane-title">Markdown 编辑</div>
      <div id="editor"></div>
    </section>
    <div class="resizer" id="resizer-1" title="拖动调整宽度"></div>
    <section class="pane preview-pane" id="pane-preview">
      <div class="pane-title">实时预览</div>
      <div id="preview" class="preview-body" contenteditable="true" spellcheck="false"></div>
    </section>
    <div class="resizer" id="resizer-2" title="拖动调整宽度"></div>
    <section class="pane outline-pane" id="pane-outline">
      <div class="pane-title" id="pane-outline-title">目录</div>
      <div id="outline-body" class="outline-body"></div>
      <div id="history-body" class="history-body">
        <div class="history-search">
          <input id="history-search-input" type="text"
                 placeholder="搜索文件名…" autocomplete="off" spellcheck="false">
        </div>
        <div id="history-list" class="history-list"></div>
      </div>
    </section>
  </main>

  <footer class="bottombar">
    <div class="status" id="status">就绪 · PicGo 图床</div>
    <div class="pin-toolbar" id="pin-toolbar" title="自定义功能区：拖拽排序，点击执行">
      <div class="pin-toolbar-inner" id="pin-toolbar-inner"></div>
    </div>
    <div class="save-actions">
      <button class="btn-save" id="btn-save" title="保存并隐藏窗口（Ctrl+Enter）">💾</button>
      <button class="btn-sync" id="btn-sync" title="保存后窗口保持打开">⟳</button>
    </div>
  </footer>

  <div id="toast" class="toast hidden"></div>
  <div id="sync-toast" class="sync-toast"></div>

  <script src="storage.js"></script>
  <script src="tab-manager.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/resize.js"></script>
  <script src="js/outline.js"></script>
  <script src="js/history.js"></script>
  <script src="context-menu.js"></script>
  <script src="explorer.js"></script>
  <script src="js/workspace.js"></script>
  <script src="js/favorites.js"></script>
  <script src="js/search.js"></script>
  <script src="js/theme-loader.js"></script>
  <script src="js/theme-manager.js"></script>
  <script src="toolbar/commands.js"></script>
  <script src="toolbar/toolbar.js"></script>
  <script src="script.js"></script>
</body>
</html>

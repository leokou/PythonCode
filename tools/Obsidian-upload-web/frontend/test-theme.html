<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Theme Test</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    /* 测试样式 - 使用 CSS 变量 */
    .test-box {
      padding: 30px;
      margin: 20px;
      background: var(--bg-main);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      font-size: 16px;
    }
    .test-box h1 { color: var(--title-color); margin-bottom: 10px; }
    .test-box .accent { color: var(--accent); font-weight: bold; }
    select {
      padding: 8px 16px;
      font-size: 14px;
      margin: 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }
    .log {
      margin: 20px;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 8px;
      font-family: monospace;
      font-size: 12px;
      white-space: pre-wrap;
      max-height: 200px;
      overflow: auto;
    }
  </style>
</head>
<body>
  <div class="test-box" id="testBox">
    <h1>主题测试</h1>
    <p>如果你能看到这段文字，说明基础 CSS 变量正在工作。</p>
    <p class="accent">这是强调色文本。</p>
    <hr style="border-color: var(--border-color); margin: 15px 0;">
    <label>窗口主题：
      <select id="winSelect">
        <option value="github">GitHub</option>
        <option value="notion">Notion</option>
        <option value="obsidian">Obsidian</option>
      </select>
    </label>
    <label>编辑区主题：
      <select id="edSelect">
        <option value="github">GitHub</option>
        <option value="monokai">Monokai</option>
        <option value="one-dark">One Dark</option>
      </select>
    </label>
  </div>
  <div class="log" id="log">日志输出：\n</div>

  <script>
    const logEl = document.getElementById('log');
    function log(msg) {
      logEl.textContent += msg + '\n';
      console.log(msg);
    }

    // 模拟 ThemeManager.apply() 的逻辑
    const links = { window: null, editor: null, preview: null };
    
    function ensureLink(kind) {
      if (!links[kind]) {
        links[kind] = document.createElement('link');
        links[kind].rel = 'stylesheet';
        document.head.appendChild(links[kind]);
        log('创建 link 标签: ' + kind);
      }
      return links[kind];
    }

    function applyTheme(kind, value) {
      const body = document.body;
      if (kind === 'window') body.setAttribute('data-window-theme', value);
      if (kind === 'editor') body.setAttribute('data-editor-theme', value);
      if (kind === 'preview') body.setAttribute('data-preview-theme', value);
      
      const link = ensureLink(kind);
      const href = 'themes/' + kind + '/' + value + '.css';
      log('设置 ' + kind + ' link href: ' + href);
      link.href = href;
      
      // 检查 CSS 是否加载成功
      link.addEventListener('load', () => {
        log('✓ CSS 加载成功: ' + href);
        // 检查 body 上的计算样式
        setTimeout(() => {
          const computed = getComputedStyle(document.body);
          log('  --bg-main: ' + computed.getPropertyValue('--bg-main'));
          log('  --text-color: ' + computed.getPropertyValue('--text-color'));
          log('  --accent: ' + computed.getPropertyValue('--accent'));
        }, 100);
      });
      link.addEventListener('error', () => {
        log('✗ CSS 加载失败: ' + href);
      });
    }

    // 初始化
    log('页面加载完成');
    log('当前 --bg-main: ' + getComputedStyle(document.body).getPropertyValue('--bg-main'));

    document.getElementById('winSelect').addEventListener('change', (e) => {
      log('\n--- 切换窗口主题: ' + e.target.value + ' ---');
      applyTheme('window', e.target.value);
    });

    document.getElementById('edSelect').addEventListener('change', (e) => {
      log('\n--- 切换编辑区主题: ' + e.target.value + ' ---');
      applyTheme('editor', e.target.value);
    });
  </script>
</body>
</html>

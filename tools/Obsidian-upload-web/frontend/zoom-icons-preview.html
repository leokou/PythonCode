<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>显示缩放按钮图标候选</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --fg:#1f2330; --muted:#8a8f9c;
    --line:#e3e6ec; --accent:#3b82f6; --hover:#eef2fb;
  }
  body[data-theme="dark"]{
    --bg:#1b1d23; --card:#24272f; --fg:#e7e9ee; --muted:#9aa0ad;
    --line:#33373f; --accent:#5b9bff; --hover:#2c313b;
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 -apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--fg);padding:28px}
  h1{font-size:18px;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 20px}
  .bar{display:flex;gap:6px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);
       border-radius:10px;padding:8px 10px;width:max-content;margin-bottom:24px}
  .tb-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:30px;
       border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--fg);
       cursor:pointer;transition:.15s}
  .tb-btn:hover{background:var(--hover)}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;max-width:760px}
  .cell{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 12px;
       text-align:center;cursor:pointer;transition:.15s;position:relative}
  .cell:hover{border-color:var(--accent);box-shadow:0 4px 14px rgba(0,0,0,.06)}
  .cell.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
  .cell .ico{display:inline-flex;width:48px;height:48px;align-items:center;justify-content:center;
       border:1px solid var(--line);border-radius:10px;margin-bottom:10px;color:var(--fg)}
  .cell .no{position:absolute;top:8px;left:10px;font-size:12px;color:var(--muted)}
  .cell .name{font-size:13px;font-weight:600}
  .cell .desc{font-size:11px;color:var(--muted);margin-top:2px}
  .foot{margin-top:22px;font-size:13px;color:var(--fg)}
  .foot b{color:var(--accent)}
  .theme-toggle{position:fixed;top:20px;right:24px;border:1px solid var(--line);background:var(--card);
       color:var(--fg);border-radius:8px;padding:6px 12px;cursor:pointer}
</style>
</head>
<body>
  <button class="theme-toggle" onclick="toggleTheme()">切换深色</button>
  <h1>显示缩放按钮 · 图标候选（10 选 1）</h1>
  <p class="sub">预览区即真实工具栏按钮样式（圆角 + 悬停高亮，自动跟随主题）。点下方卡片选中，记下编号告诉我即可。</p>

  <div class="bar" id="bar"></div>

  <div class="grid" id="grid"></div>

  <div class="foot">当前选择：<b id="choice">未选</b></div>

<script>
const ICONS = [
  {name:"放大镜 +", desc:"经典 zoom-in", svg:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="15.5" y1="15.5" x2="21" y2="21"/><line x1="10.5" y1="7.5" x2="10.5" y2="13.5"/><line x1="7.5" y1="10.5" x2="13.5" y2="10.5"/></svg>'},
  {name:"缩小镜 -", desc:"zoom-out", svg:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="15.5" y1="15.5" x2="21" y2="21"/><line x1="7.5" y1="10.5" x2="13.5" y2="10.5"/></svg>'},
  {name:"双栏 + 箭头", desc:"编辑区/预览区同步缩放", svg:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="7" height="16" rx="1"/><rect x="14" y="4" width="7" height="16" rx="1"/><path d="M11 9l2 3-2 3"/></svg>'},
  {name:"滑块旋钮", desc:"拖拽设置（最贴合弹窗）", svg:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="12" x2="20" y2="12"/><circle cx="13" cy="12" r="3.4" fill="currentColor"/></svg>'},
  {name:"直尺", desc:"比例/刻度", svg:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="10" rx="1"/><line x1="6" y1="7" x2="6" y2="11"/><line x1="10" y1="7" x2="10" y2="13"/><line x1="14" y1="7" x2="14" y2="11"/><line x1="18" y1="7" x2="18" y2="13"/></svg>'},
  {name:"适应屏幕", desc:"fit / 缩放适配", svg:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 9 4 4 9 4"/><polyline points="15 4 20 4 20 9"/><polyline points="20 15 20 20 15 20"/><polyline points="9 20 4 20 4 15"/></svg>'},
  {name:"百分比 %", desc:"直白显示比例", svg:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="18" x2="18" y2="6"/><circle cx="7.5" cy="7.5" r="2.6"/><circle cx="16.5" cy="16.5" r="2.6"/></svg>'},
  {name:"同心方框", desc:"缩放层级", svg:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><rect x="8" y="8" width="13" height="13" rx="2" fill="currentColor" fill-opacity="0.18"/></svg>'},
  {name:"显示器", desc:"显示区域", svg:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>'},
  {name:"文字 + 镜", desc:"放大文字显示", svg:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19l3-9 3 9"/><line x1="6" y1="16" x2="10" y2="16"/><circle cx="15" cy="15" r="4"/><line x1="18.5" y1="18.5" x2="21" y2="21"/></svg>'}
];

const bar = document.getElementById('bar');
const grid = document.getElementById('grid');
const choice = document.getElementById('choice');

ICONS.forEach((ic, i) => {
  const b = document.createElement('button');
  b.className = 'tb-btn';
  b.title = (i+1) + '. ' + ic.name;
  b.innerHTML = ic.svg;
  bar.appendChild(b);

  const c = document.createElement('div');
  c.className = 'cell';
  c.innerHTML = '<span class="no">#'+(i+1)+'</span>' +
    '<div class="ico">'+ic.svg+'</div>' +
    '<div class="name">'+ic.name+'</div>' +
    '<div class="desc">'+ic.desc+'</div>';
  c.onclick = () => {
    document.querySelectorAll('.cell').forEach(x=>x.classList.remove('sel'));
    c.classList.add('sel');
    choice.textContent = '#'+(i+1)+'  '+ic.name+'（'+ic.desc+'）';
  };
  grid.appendChild(c);
});

function toggleTheme(){
  const dark = document.body.getAttribute('data-theme') === 'dark';
  document.body.setAttribute('data-theme', dark ? 'light' : 'dark');
  event.target.textContent = dark ? '切换深色' : '切换浅色';
}
</script>
</body>
</html>

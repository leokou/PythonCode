<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>body{margin:0;font-family:monospace}div{height:300px;overflow:hidden;border-bottom:1px solid #ccc}</style>
</head>
<body>
<div id="a"></div>
<div id="b"></div>
<pre id="result">PENDING</pre>
<script src="../frontend/vendor/cm6.min.js"></script>
<script>
"use strict";
const { EditorView, EditorState, keymap, lineNumbers, defaultKeymap, ViewPlugin } = window.CodeMirrorBundle;

let doc = "";
for (let i = 1; i <= 200; i++) doc += "line " + i + " - 0123456789\n";

const baseExt = [lineNumbers(), keymap.of([...defaultKeymap])];

/* ---- 实例 A：CM6 内置行为 ---- */
let viewA = new EditorView({ parent: document.getElementById("a"), extensions: baseExt, doc });

/* ---- 实例 B：复刻 cursorFollow 插件逻辑 ---- */
const MARGIN_TOP = 10, MARGIN_BOTTOM = 40;
function ensureVisible(v) {
  const main = v.state.selection.main;
  if (!main.empty) return;
  const scroller = v.scrollDOM, sh = scroller.clientHeight;
  if (sh === 0) return;
  const block = v.lineBlockAt(main.head), st = scroller.scrollTop;
  let target = null;
  if (block.top < st + MARGIN_TOP) target = Math.max(0, block.top - MARGIN_TOP);
  else if (block.bottom > st + sh - MARGIN_BOTTOM) target = Math.max(0, block.bottom + MARGIN_BOTTOM - sh);
  if (target === null) return;
  if (Math.abs(scroller.scrollTop - target) > 1) {
    scroller.scrollTop = target;
    requestAnimationFrame(() => {
      const b2 = v.lineBlockAt(v.state.selection.main.head);
      const st2 = scroller.scrollTop, sh2 = scroller.clientHeight;
      if (b2.bottom > st2 + sh2 - MARGIN_BOTTOM) {
        scroller.scrollTop = Math.min(b2.bottom + MARGIN_BOTTOM - sh2, Math.max(0, scroller.scrollHeight - sh2));
      }
    });
  }
}
const followPlugin = ViewPlugin.fromClass(class {
  update(u) {
    if (u.docChanged || u.selectionSet) requestAnimationFrame(() => ensureVisible(u.view));
  }
});
let viewB = new EditorView({ parent: document.getElementById("b"), extensions: baseExt.concat(followPlugin), doc });

function run() {
  /* 1) 光标移到文档末尾（无 scrollIntoView，模拟无焦点事务） */
  const endA = viewA.state.doc.length, endB = viewB.state.doc.length;
  viewA.dispatch({ selection: { anchor: endA } });
  viewB.dispatch({ selection: { anchor: endB } });
  const stA0 = viewA.scrollDOM.scrollTop, stB0 = viewB.scrollDOM.scrollTop;

  /* 2) 模拟最后一行回车：末尾插入 \n，光标到新行 */
  viewA.dispatch({ changes: { from: endA, to: endA, insert: "\n" }, selection: { anchor: endA + 1 } });
  viewB.dispatch({ changes: { from: endB, to: endB, insert: "\n" }, selection: { anchor: endB + 1 } });

  /* 3) 等待 rAF 后读取结果 */
  setTimeout(() => {
    /* 4) 补充：有焦点场景（编辑器 focus 后回车，CM6 内置应滚动） */
    viewA.focus();
    const e2 = viewA.state.doc.length;
    viewA.dispatch({ changes: { from: e2, to: e2, insert: "\n" }, selection: { anchor: e2 + 1 } });
    setTimeout(() => {
      const res = {
        viewportHeight: viewA.scrollDOM.clientHeight,
        before: { builtin: stA0, plugin: stB0 },
        after: { builtin: viewA.scrollDOM.scrollTop, plugin: viewB.scrollDOM.scrollTop },
        afterFocusBuiltin: viewA.scrollDOM.scrollTop,
        scrollHeight: { builtin: viewA.scrollDOM.scrollHeight, plugin: viewB.scrollDOM.scrollHeight },
        cursorVisibleBuiltin: viewA.scrollDOM.scrollTop + viewA.scrollDOM.clientHeight >= viewA.scrollDOM.scrollHeight - 5,
        cursorVisiblePlugin: viewB.scrollDOM.scrollTop + viewB.scrollDOM.clientHeight >= viewB.scrollDOM.scrollHeight - 5,
        cursorLineVisibleBuiltin: viewA.lineBlockAt(viewA.state.selection.main.head).bottom <= viewA.scrollDOM.scrollTop + viewA.scrollDOM.clientHeight,
        cursorLineVisiblePlugin: viewB.lineBlockAt(viewB.state.selection.main.head).bottom <= viewB.scrollDOM.scrollTop + viewB.scrollDOM.clientHeight,
        diagB: (function () {
          const b = viewB.lineBlockAt(viewB.state.selection.main.head);
          return { head: viewB.state.selection.main.head, lines: viewB.state.doc.lines,
                   blockTop: b.top, blockBottom: b.bottom,
                   st: viewB.scrollDOM.scrollTop, sh: viewB.scrollDOM.clientHeight };
        })(),
      };
      document.getElementById("result").textContent = "RESULT=" + JSON.stringify(res);
    }, 400);
  }, 400);
}
run();
</script>
</body>
</html>

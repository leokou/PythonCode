<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>body{margin:0;font-family:monospace}#pv{width:600px;min-height:100px;border:1px solid #ccc;padding:8px}</style>
</head>
<body>
<div id="pv" contenteditable="true"><p data-line="1">字A字B</p></div>
<pre id="result">PENDING</pre>
<script>
"use strict";
const previewEl = document.getElementById("pv");

/* ---- 复刻 script.js 核心函数（与真实实现一致） ---- */
function _computeSimpleDiff(oldText, newText) {
  if (oldText === newText) return null;
  const minLen = Math.min(oldText.length, newText.length);
  let start = 0;
  while (start < minLen && oldText[start] === newText[start]) start++;
  let oldEnd = oldText.length, newEnd = newText.length;
  while (oldEnd > start && newEnd > start && oldText[oldEnd - 1] === newText[newEnd - 1]) { oldEnd--; newEnd--; }
  return { start, oldLen: oldEnd - start, newLen: newEnd - start,
           removed: oldText.substring(start, oldEnd), added: newText.substring(start, newEnd) };
}
function _extractPlainText(md) {
  return md
    .replace(/!\[.*?\]\(.*?\)/g, '')
    .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
    .replace(/[*_]{1,3}/g, '')
    .replace(/`([^`]*)`/g, '$1')
    .replace(/~~([^~]*)~~/g, '$1')
    .replace(/^#{1,6}\s+/gm, '')
    .replace(/^[-*]\s+/gm, '')
    .replace(/^\d+\.\s+/gm, '')
    .replace(/^>\s+/gm, '')
    .replace(/\n{2,}/g, '\n')
    .trim();
}
function _applyDiffToMarkdown(markdown, oldPlain, newPlain, diff) {
  if (!diff) return markdown;
  const textPositions = [];
  let plainIdx = 0, i = 0;
  while (i < markdown.length) {
    const ch = markdown[i], next2 = markdown.substring(i, i + 2);
    if (next2 === "**" || next2 === "__") { textPositions.push(-1, -1); i += 2; continue; }
    if (ch === '`' || ch === '*' || ch === '_' || ch === '~') { textPositions.push(-1); i++; continue; }
    if (ch === '[') {
      textPositions.push(-1); i++;
      while (i < markdown.length && markdown[i] !== ']') { textPositions.push(plainIdx++); i++; }
      if (i < markdown.length) { textPositions.push(-1); i++; }
      if (i < markdown.length && markdown[i] === '(') {
        textPositions.push(-1); i++;
        while (i < markdown.length && markdown[i] !== ')') { textPositions.push(-1); i++; }
        if (i < markdown.length) { textPositions.push(-1); i++; }
      }
      continue;
    }
    textPositions.push(plainIdx++);
    i++;
  }
  const { start, oldLen, newLen, added } = diff;
  let mdStart = -1;
  for (let j = 0; j < textPositions.length; j++) {
    if (textPositions[j] === start) { mdStart = j; break; }
    if (textPositions[j] > start) break;
  }
  if (mdStart === -1) return _fallbackReplace(markdown, newPlain);
  let mdEnd = mdStart;
  if (oldLen > 0) {
    let plainCount = 0;
    for (let j = mdStart; j < textPositions.length; j++) {
      if (textPositions[j] >= start + oldLen) { mdEnd = j; break; }
      if (textPositions[j] >= start) plainCount++;
      if (plainCount >= oldLen) { mdEnd = j + 1; break; }
    }
    if (mdEnd === mdStart) mdEnd = mdStart + oldLen;
  }
  let result = markdown.substring(0, mdStart) + added + markdown.substring(mdEnd);
  if (_extractPlainText(result) !== newPlain) return _fallbackReplace(markdown, newPlain);
  return result;
}
function _fallbackReplace(markdown, newPlain) {
  const lines = markdown.split('\n');
  const plainLines = newPlain.split('\n');
  const result = [];
  for (let i = 0; i < lines.length; i++) {
    if (i < plainLines.length) {
      const line = lines[i];
      const prefixMatch = line.match(/^((?:#{1,6}\s+)|(?:[-*+]\s+)|(?:>\s+)|(?:\d+\.\s+)|(?:\s*))/);
      result.push((prefixMatch ? prefixMatch[1] : '') + plainLines[i]);
    } else result.push(lines[i]);
  }
  return result.join('\n');
}
function _findCursorBlock() {
  const sel = window.getSelection();
  if (!sel || sel.rangeCount === 0) return null;
  let node = sel.anchorNode;
  if (!node) return null;
  if (node.nodeType === Node.TEXT_NODE) node = node.parentNode;
  while (node && node !== previewEl) {
    if (node.nodeType === Node.ELEMENT_NODE && node.hasAttribute && node.hasAttribute("data-line")) return node;
    node = node.parentNode;
  }
  return null;
}

/* ---- 场景模拟 ---- */
let state = { markdown: "字A字B", oldPlain: null, oldMd: null, oldLine: -1, lastBlock: null };
const result = {};

/* 场景 A：首次操作是"删除最后一个字"（beforeinput 修复前后对比） */
const block = previewEl.querySelector("[data-line='1']");

/* A1：修复前（input 后保存基准，基准=编辑后文本 "字A"）→ diff null → 不同步 */
const oldBug = (() => {
  state.oldPlain = "字A";                 /* 错误基准（编辑后） */
  state.oldMd = "字A字B";
  const newPlain = "字A";
  const diff = _computeSimpleDiff(state.oldPlain, newPlain);
  return { diff, synced: diff !== null };
})();

/* A2：修复后（beforeinput 保存基准=编辑前 "字A字B"）→ diff 正确 → markdown "字A" */
const fixed = (() => {
  state.oldPlain = "字A字B";              /* 正确基准（编辑前） */
  state.oldMd = "字A字B";
  const newPlain = "字A";
  const diff = _computeSimpleDiff(state.oldPlain, newPlain);
  if (!diff) return { diff, md: state.oldMd };
  const md = _applyDiffToMarkdown(state.oldMd, state.oldPlain, newPlain, diff);
  return { diff, md };
})();

/* 场景 B：连续输入（基准正确时） */
const typed = (() => {
  state.oldPlain = "字A字B";
  state.oldMd = "字A字B";
  const newPlain = "字A字BCD";           /* 输入 C、D 后 */
  const diff = _computeSimpleDiff(state.oldPlain, newPlain);
  const md = _applyDiffToMarkdown(state.oldMd, state.oldPlain, newPlain, diff);
  return { diff, md };
})();

/* 场景 C：光标 clamp 验证（修复后 remaining === len 时光标在文本末尾） */
const cursorClamp = (() => {
  /* 构造：文本节点 "字A字B"，光标应在末尾（offset 4） */
  const p = document.createElement("p");
  p.setAttribute("data-line", "9");
  p.textContent = "字A字B";
  previewEl.appendChild(p);
  const tn = p.firstChild;
  const sel = window.getSelection();
  const r = document.createRange();
  const remaining = 4; /* 期望光标在末尾 */
  const len = tn.nodeValue.length;
  r.setStart(tn, Math.max(0, Math.min(remaining, len))); /* 修复后 */
  r.collapse(true);
  sel.removeAllRanges();
  sel.addRange(r);
  const fixedOffset = r.startOffset;
  /* 修复前（len-1）会是什么 */
  const oldOffset = Math.max(0, Math.min(remaining, len - 1));
  previewEl.removeChild(p);
  return { len, fixedOffset, oldClampOffset: oldOffset, correctAtEnd: fixedOffset === len };
})();

result.oldBugFirstDelete = oldBug;
result.fixedFirstDelete = fixed;
result.continuousTyping = typed;
result.cursorClamp = cursorClamp;

document.getElementById("result").textContent = "RESULT=" + JSON.stringify(result);
</script>
</body>
</html>
